<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Lottery Game Board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111;
    --panel: #1c1c1c;
    --tile: #292929;
    --line: #484848;
    --text: #f4f4f4;
    --muted: #aaa;
    --accent: #d3b35a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 Arial, sans-serif;
  }

  main { max-width: 1600px; margin: 0 auto; }
  h1 { margin: 0 0 6px; }
  .hint { color: var(--muted); margin: 0 0 20px; }

  .toolbar, .add-form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: end;
    padding: 14px;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  label {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 13px;
  }

  input, select, button {
    font: inherit;
    color: var(--text);
    background: #101010;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 9px 11px;
  }

  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .primary { background: #67551e; border-color: var(--accent); }
  .danger { color: #ffb1b1; }

  .board {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    gap: 10px;
  }

  .slot {
    position: relative;
    min-height: 132px;
    padding: 8px;
    background: var(--tile);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    isolation: isolate;
  }

  .slot-top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 9px;
  }

  .slot-number {
    color: var(--accent);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: .04em;
  }

  .sold-button {
    padding: 3px 7px;
    color: #ffb1b1;
    border-color: #704040;
    font-size: 12px;
  }

  .slot-pick {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    min-height: 84px;
    padding: 8px;
    text-align: left;
    background: #202020;
    border-color: #3e3e3e;
  }

  .slot-pick.empty {
    min-height: 84px;
    background: transparent;
    border-color: transparent;
  }

  .slot-pick.empty:hover,
  .slot-pick.empty:focus-visible {
    background: rgba(255, 255, 255, .04);
    border-color: #555;
  }

  .game-name {
    font-weight: 600;
    line-height: 1.2;
  }

  .game-details {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
  }

  .price-badge {
    display: inline-block;
    padding: 3px 8px;
    border: 1px solid #b89b4a;
    border-radius: 999px;
    background: #51431d;
    color: #ffe28a;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
  }

  .ticket-number {
    color: #bbb;
    font-size: 12px;
    white-space: nowrap;
  }

  .slot.sold::after {
    content: "X";
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    color: rgba(255, 45, 45, .55);
    font-size: clamp(48px, 8vw, 82px);
    font-weight: 900;
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 2px 5px rgba(0, 0, 0, .35);
  }

  details {
    margin-top: 24px;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  summary { cursor: pointer; font-weight: bold; }

  .game-list {
    display: grid;
    gap: 6px;
    margin-top: 12px;
  }

  .game-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    background: #252525;
    border-radius: 6px;
  }

  dialog {
    width: min(640px, calc(100% - 24px));
    max-height: 85vh;
    color: var(--text);
    background: #1b1b1b;
    border: 1px solid #666;
    border-radius: 10px;
  }

  dialog::backdrop { background: rgba(0, 0, 0, .75); }

  .dialog-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .search-row {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 8px;
  }

  #search { width: 100%; }
  #results { display: grid; gap: 7px; margin-top: 12px; }
  .result { text-align: left; }
  .result small { display: block; color: var(--muted); }
  .empty-note { color: var(--muted); }

  .empty-option {
    width: 100%;
    text-align: left;
    background: #303030;
    border: 1px dashed #777;
  }

  footer {
    margin: 28px auto 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }

  @media (max-width: 800px) {
    body { padding: 12px; }
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    .slot { min-height: 128px; padding: 6px; }
  }

  @media (max-width: 480px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<main>
  <h1>CT Lottery</h1>
  <p class="hint">Click a box to choose a game. Use the sold-out button to mark it sold out.</p>

  <div class="toolbar">
    <button id="exportButton" type="button">Download backup</button>
    <button id="importButton" type="button">Restore backup</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <span id="saveStatus" class="hint"></span>
  </div>

  <section id="board" class="board" aria-label="Numbered game board"></section>

  <details>
    <summary>Manage game list (<span id="gameCount">0</span>)</summary>

    <form id="addForm" class="add-form">
      <label>Price
        <select id="newPrice" required>
          <option value="$1">$1</option>
          <option value="$2">$2</option>
          <option value="$3">$3</option>
          <option value="$5">$5</option>
          <option value="$10">$10</option>
          <option value="$20">$20</option>
          <option value="$30">$30</option>
          <option value="$50">$50</option>
        </select>
      </label>

      <label>Game name
        <input id="newName" required placeholder="Example: Holiday Cash 100X">
      </label>

      <label>Game number
        <input id="newNumber" required placeholder="1848">
      </label>

      <button class="primary" type="submit">Add game</button>
    </form>

    <div id="gameList" class="game-list"></div>
  </details>

  <footer>lxraverxl© -- 2026</footer>
</main>

<dialog id="picker">
  <div class="dialog-head">
    <h2>Choose a game</h2>
    <button id="closePicker" type="button">Close</button>
  </div>

  <div class="search-row">
    <input id="search" type="search" placeholder="Search name, number, or price">
    <select id="priceFilter">
      <option value="">All prices</option>
      <option>$1</option>
      <option>$2</option>
      <option>$3</option>
      <option>$5</option>
      <option>$10</option>
      <option>$20</option>
      <option>$30</option>
      <option>$50</option>
    </select>
  </div>

  <div id="results"></div>
</dialog>

<script>
const STORAGE_KEY = "scratchGameBoardPrototypeV1";
const API_URL = "https://script.google.com/macros/s/AKfycby9SXg9bMKJFTe4ljHN6W5-3ypRwlEgDMIQfh9i7_RokbjBIrPY2Kre19p3fm86q4Ok/exec";
const WRITE_KEY = "847f7d849597v74rjkkn4ifrkf4848f7575tigkvdkfk4ri";
const REFRESH_INTERVAL = 10 * 60 * 1000;

const starterGames = [
  ["$1", "$1 Monopoly", "1888"],
  ["$1", "$50 Loaded!", "1870"],
  ["$1", "10X The Cash", "1863"],

  ["$10", "10X The Cash", "1805"],

  ["$10", "Hit $500", "1834"],
  ["$10", "Holiday Cash 100X", "1848"],
  ["$10", "Pinball Wizard", "1857"],
  ["$10", "Red Hot 10's", "1886"],
  ["$10", "Scorching Hot 7's", "1836"],
  ["$10", "Triple Red 777's", "1852"],
  ["$10", "X The Money", "1894"],

  ["$20", "$100, $200 or $500", "1858"],
  ["$20", "$100, $200 or $500", "1905"],
  ["$20", "$250,000 Cashword", "1879"],
  ["$20", "200X", "1856"],
  ["$20", "20X The Cash", "1813"],
  ["$20", "Lucky 7 Tripler", "1887"],

  ["$30", "$500,000 Cashword", "1800"],
  ["$30", "Fabulous Fortune", "1860"],
  ["$30", "Win Big", "1816"],

  ["$50", "Best Chance To Be A Millionaire", "1850"]
];

function makeId() {
  return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function initialState() {
  return {
    games: starterGames.map(([price, name, number]) => ({
      id: makeId(),
      price,
      name,
      number
    })),
    slots: {}
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : initialState();
  } catch {
    return initialState();
  }
}

let state = loadState();
let activeSlot = null;
let cloudSaveTimer;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById("saveStatus").textContent =
    "Saved on this device; syncing…";

  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          key: WRITE_KEY,
          data: state
        })
      });

      document.getElementById("saveStatus").textContent =
        "Sync sent; check another device to confirm";
    } catch (error) {
      document.getElementById("saveStatus").textContent =
        "Cloud sync failed; saved on this device";
      console.error("Cloud save failed:", error);
    }
  }, 400);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  for (let n = 1; n <= 65; n++) {
    const assignment = state.slots[n];
    const hasGame = Boolean(assignment?.name);
    const tile = document.createElement("div");
    tile.className = "slot" + (assignment?.sold ? " sold" : "");

    const top = document.createElement("div");
    top.className = "slot-top";

    const number = document.createElement("span");
    number.className = "slot-number";
    number.textContent = `BOX ${n}`;

    const sold = document.createElement("button");
    sold.className = "sold-button";
    sold.type = "button";
    sold.textContent = assignment?.sold ? "Mark available" : "Sold out";
    sold.title = assignment?.sold
      ? "Remove sold-out mark"
      : "Mark this box sold out";
    sold.addEventListener("click", () => {
      if (!state.slots[n]) {
        state.slots[n] = { name: "", number: "", price: "", sold: true };
      } else {
        state.slots[n].sold = !state.slots[n].sold;
      }
      saveState();
      renderBoard();
    });

    top.append(number, sold);

    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "slot-pick" + (hasGame ? "" : " empty");
    pick.setAttribute(
      "aria-label",
      hasGame
        ? `Change game in box ${n}`
        : `Choose a game for box ${n}`
    );
    pick.title = hasGame
      ? "Click to change or clear game"
      : "Click to choose a game";

    if (hasGame) {
      const name = document.createElement("span");
      name.className = "game-name";
      name.textContent = assignment.name;

      const details = document.createElement("span");
      details.className = "game-details";

      const price = document.createElement("span");
      price.className = "price-badge";
      price.textContent = assignment.price;

      const ticket = document.createElement("span");
      ticket.className = "ticket-number";
      ticket.textContent = `Ticket #${assignment.number}`;

      details.append(price, ticket);
      pick.append(name, details);
    }

    pick.addEventListener("click", () => openPicker(n));

    tile.append(top, pick);
    board.append(tile);
  }
}

function openPicker(slotNumber) {
  activeSlot = slotNumber;
  document.getElementById("search").value = "";
  document.getElementById("priceFilter").value = "";
  document.getElementById("picker").showModal();
  renderResults();
  document.getElementById("search").focus();
}

function clearActiveSlot() {
  const previous = state.slots[activeSlot];
  const sold = previous?.sold || false;

  if (sold) {
    state.slots[activeSlot] = {
      name: "",
      number: "",
      price: "",
      sold: true
    };
  } else {
    delete state.slots[activeSlot];
  }

  saveState();
  renderBoard();
  document.getElementById("picker").close();
}

function renderResults() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const price = document.getElementById("priceFilter").value;
  const results = document.getElementById("results");

  results.innerHTML = "";

  const emptyButton = document.createElement("button");
  emptyButton.type = "button";
  emptyButton.className = "empty-option";
  emptyButton.textContent = "Leave box empty / Clear game";
  emptyButton.addEventListener("click", clearActiveSlot);
  results.append(emptyButton);

  const matches = state.games.filter(game => {
    const matchesPrice = !price || game.price === price;
    const text = `${game.name} ${game.number} ${game.price}`.toLowerCase();
    return matchesPrice && text.includes(query);
  });

  if (!matches.length) {
    const note = document.createElement("p");
    note.className = "empty-note";
    note.textContent =
      "No matching games. Add it below under “Manage game list.”";
    results.append(note);
    return;
  }

  for (const game of matches) {
    const button = document.createElement("button");
    button.className = "result";
    button.type = "button";
    button.innerHTML =
      `${escapeHtml(game.name)}<small>${escapeHtml(game.price)} · Ticket #${escapeHtml(game.number)}</small>`;

    button.addEventListener("click", () => {
      const previous = state.slots[activeSlot];
      state.slots[activeSlot] = {
        name: game.name,
        number: game.number,
        price: game.price,
        sold: previous?.sold || false
      };
      saveState();
      renderBoard();
      document.getElementById("picker").close();
    });

    results.append(button);
  }
}

function renderGameList() {
  const list = document.getElementById("gameList");
  document.getElementById("gameCount").textContent = state.games.length;
  list.innerHTML = "";

  const sorted = [...state.games].sort((a, b) =>
    a.price.localeCompare(b.price, undefined, { numeric: true }) ||
    a.name.localeCompare(b.name) ||
    a.number.localeCompare(b.number)
  );

  for (const game of sorted) {
    const row = document.createElement("div");
    row.className = "game-row";

    const text = document.createElement("span");
    text.textContent =
      `${game.price} — ${game.name} — Ticket #${game.number}`;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger";
    remove.textContent = "Remove from list";
    remove.addEventListener("click", () => {
      if (!confirm(
        `Remove ${game.name} (ticket #${game.number}) from the game list? Existing board assignments will remain.`
      )) return;

      state.games = state.games.filter(item => item.id !== game.id);
      saveState();
      renderGameList();
      renderResults();
    });

    row.append(text, remove);
    list.append(row);
  }
}

document.getElementById("search").addEventListener("input", renderResults);
document.getElementById("priceFilter").addEventListener("change", renderResults);

document.getElementById("closePicker").addEventListener("click", () => {
  document.getElementById("picker").close();
});

document.getElementById("addForm").addEventListener("submit", event => {
  event.preventDefault();

  const price = document.getElementById("newPrice").value;
  const name = document.getElementById("newName").value.trim();
  const number = document.getElementById("newNumber").value.trim();

  if (!name || !number) return;

  state.games.push({ id: makeId(), price, name, number });
  saveState();
  renderGameList();
  event.target.reset();
  document.getElementById("newPrice").value = "$1";
});

document.getElementById("exportButton").addEventListener("click", () => {
  const file = new Blob([JSON.stringify(state, null, 2)], {
    type: "application/json"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = "game-board-backup.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

document.getElementById("importButton").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const imported = JSON.parse(await file.text());

    if (!Array.isArray(imported.games) ||
        !imported.slots ||
        typeof imported.slots !== "object") {
      throw new Error("That file does not look like a game-board backup.");
    }

    state = imported;
    saveState();
    renderBoard();
    renderGameList();
    alert("Backup restored.");
  } catch (error) {
    alert("Could not restore that file: " + error.message);
  }

  event.target.value = "";
});

async function loadCloudState() {
  try {
    const response = await fetch(API_URL, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const cloudState = await response.json();

    if (!cloudState ||
        !Array.isArray(cloudState.games) ||
        !cloudState.slots ||
        typeof cloudState.slots !== "object") {
      throw new Error("Drive data must contain games and slots.");
    }

    const needsInitialCatalog = cloudState.games.length === 0;

    if (needsInitialCatalog) {
      cloudState.games = starterGames.map(([price, name, number]) => ({
        id: makeId(),
        price,
        name,
        number
      }));
    }

    state = cloudState;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    renderBoard();
    renderGameList();
    document.getElementById("saveStatus").textContent =
      "Loaded from Google Drive";

    if (needsInitialCatalog) saveState();
  } catch (error) {
    console.error("Cloud load failed:", error);
    document.getElementById("saveStatus").textContent =
      "Could not load cloud data; showing this device's saved data";
  }
}

renderBoard();
renderGameList();
document.getElementById("saveStatus").textContent =
  "Loading from Google Drive…";

loadCloudState();
setInterval(loadCloudState, REFRESH_INTERVAL);
</script>
</body>
</html>
